<?xml version="1.0" encoding="UTF-8"?>
<!--
  Splash screen master. 1080x1920 (portrait, matches xxhdpi launch canvas)
  with soft radial vignette background matching the app's ink1000 → ink900
  gradient. Symbol is centered at ~30% of the shorter axis; wordmark sits
  a comfortable optical distance below. Tagline is optional and rendered
  in ink300 at low weight for hierarchy.

  The launcher does NOT include the wordmark. This is a splash-only lockup.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="splashBg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0E1215"/>
      <stop offset="1" stop-color="#07090B"/>
    </radialGradient>
    <linearGradient id="arcSoftSP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88C6A5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5AA37D" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="arcMidSP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA37D" stop-opacity="1"/>
      <stop offset="1" stop-color="#3E7A5B" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5AA37D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5AA37D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1920" fill="url(#splashBg)"/>

  <!-- Ambient glow behind the symbol. -->
  <circle cx="540" cy="820" r="360" fill="url(#glow)"/>

  <!--
    Symbol: 108-unit native, scaled to 360px wide (~x3.333). Centered
    horizontally at x=540, positioned so the symbol center sits at y=820.
    Translate by (540 - 54*3.333, 820 - 54*3.333) = (360, 640).
  -->
  <g transform="translate(360 640) scale(3.333)">
    <path d="M 61.639 10.437 A 44 44 0 0 1 97.563 45.361"
          fill="none" stroke="url(#arcSoftSP)" stroke-width="3.2"
          stroke-linecap="round" opacity="0.55"/>
    <path d="M 47.750 18.281 A 36 36 0 0 1 89.719 39.750"
          fill="none" stroke="url(#arcSoftSP)" stroke-width="3.2"
          stroke-linecap="round" opacity="0.78"/>
    <path d="M 40.000 29.373 A 28 28 0 0 1 82.000 30.006"
          fill="none" stroke="url(#arcMidSP)" stroke-width="3.6"
          stroke-linecap="round"/>
    <circle cx="97.5" cy="45.4" r="2.4" fill="#88C6A5"/>
    <circle cx="61.6" cy="10.4" r="1.8" fill="#88C6A5" opacity="0.75"/>
    <circle cx="54" cy="54" r="22" fill="none" stroke="#5AA37D" stroke-width="2.4"/>
    <g stroke="#5AA37D" stroke-width="2" stroke-linecap="round">
      <line x1="54" y1="30" x2="54" y2="33.5"/>
      <line x1="78" y1="54" x2="74.5" y2="54"/>
      <line x1="54" y1="78" x2="54" y2="74.5"/>
      <line x1="30" y1="54" x2="33.5" y2="54"/>
    </g>
    <g transform="rotate(30 54 54)">
      <path d="M 54 40 L 62 66 L 54 61 L 46 66 Z" fill="#F4F6F8"/>
      <path d="M 54 40 L 62 66 L 54 61 Z" fill="#5AA37D"/>
      <line x1="54" y1="40" x2="54" y2="61"
            stroke="#0E1215" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Wordmark below the symbol. -->
  <text x="540" y="1220"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="128"
        letter-spacing="14"
        text-anchor="middle">
    <tspan fill="#F4F6F8">OFF</tspan><tspan fill="#5AA37D">GRID</tspan>
  </text>

  <!-- Tagline. -->
  <text x="540" y="1300"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400"
        font-size="34"
        letter-spacing="2"
        text-anchor="middle"
        fill="#7B8690">
    Stay connected when the network disappears.
  </text>
</svg>
