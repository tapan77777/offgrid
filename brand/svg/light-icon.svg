<?xml version="1.0" encoding="UTF-8"?>
<!-- Light-background version. For use on white/light UI surfaces (docs,
     store listings, marketing pages). Darker forest strokes on light bg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="arcSoftL2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA37D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3E7A5B" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="arcMidL2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E7A5B" stop-opacity="1"/>
      <stop offset="1" stop-color="#1F3B2E" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="192" height="192" rx="42" ry="42" fill="#F4F6F8"/>
  <rect x="0.5" y="0.5" width="191" height="191" rx="41.5" ry="41.5"
