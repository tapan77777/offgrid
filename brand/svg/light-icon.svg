    <circle cx="97.5" cy="45.4" r="2.4" fill="#3E7A5B"/>
    <circle cx="61.6" cy="10.4" r="1.8" fill="#3E7A5B" opacity="0.75"/>
    <circle cx="54" cy="54" r="22" fill="none" stroke="#3E7A5B" stroke-width="2.4"/>
    <g stroke="#3E7A5B" stroke-width="2" stroke-linecap="round">
      <line x1="54" y1="30" x2="54" y2="33.5"/>
      <line x1="78" y1="54" x2="74.5" y2="54"/>
      <line x1="54" y1="78" x2="54" y2="74.5"/>
      <line x1="30" y1="54" x2="33.5" y2="54"/>
    </g>
    <g transform="rotate(30 54 54)">
      <path d="M 54 40 L 62 66 L 54 61 L 46 66 Z" fill="#0E1215"/>
