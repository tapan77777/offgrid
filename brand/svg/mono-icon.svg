<?xml version="1.0" encoding="UTF-8"?>
<!-- Monochrome mark. Everything is currentColor so consumers can tint via
     CSS `color:` or SVG `fill`/`stroke` inheritance. Rasterizes to a
     one-color icon suitable for status-bar / theme notifications. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108"
     fill="none" stroke="currentColor" color="#F4F6F8">
  <path d="M 61.639 10.437 A 44 44 0 0 1 97.563 45.361"
        stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M 47.750 18.281 A 36 36 0 0 1 89.719 39.750"
        stroke-width="3.2" stroke-linecap="round" opacity="0.78"/>
  <path d="M 40.000 29.373 A 28 28 0 0 1 82.000 30.006"
        stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="97.5" cy="45.4" r="2.4" fill="currentColor" stroke="none"/>
  <circle cx="61.6" cy="10.4" r="1.8" fill="currentColor" stroke="none" opacity="0.75"/>
  <circle cx="54" cy="54" r="22" stroke-width="2.4"/>
  <g stroke-width="2" stroke-linecap="round">
    <line x1="54" y1="30" x2="54" y2="33.5"/>
    <line x1="78" y1="54" x2="74.5" y2="54"/>
    <line x1="54" y1="78" x2="54" y2="74.5"/>
    <line x1="30" y1="54" x2="33.5" y2="54"/>
  </g>
  <g transform="rotate(30 54 54)">
    <path d="M 54 40 L 62 66 L 54 61 L 46 66 Z"
          fill="currentColor" stroke="none"/>
  </g>
</svg>
